<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <h1 class="app-title">Expense &amp; Budget Visualizer</h1>
    <div class="balance-card">
      <span class="balance-label">Current Balance</span>
      <span id="balance-display" class="balance-amount">$0.00</span>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="site-main">

    <!-- Left column (form + settings) -->
    <section class="panel panel--left">

      <!-- Input Form -->
      <article class="card" id="add-transaction-section">
        <h2>Add Transaction</h2>
        <form id="transaction-form" novalidate>
          <div class="field-group">
            <label for="item-name">Item Name</label>
            <input
              type="text"
              id="item-name"
              name="itemName"
              placeholder="e.g. Coffee"
              maxlength="100"
              autocomplete="off"
            />
            <span class="field-error" id="item-name-error" role="alert"></span>
          </div>

          <div class="field-group">
            <label for="amount">Amount</label>
            <input
              type="number"
              id="amount"
              name="amount"
              placeholder="0.00"
              min="0.01"
              step="0.01"
            />
            <span class="field-error" id="amount-error" role="alert"></span>
          </div>

          <div class="field-group">
            <label for="category">Category</label>
            <select id="category" name="category">
              <!-- populated by renderCategoryDropdown() -->
            </select>
            <span class="field-error" id="category-error" role="alert"></span>
          </div>

          <button type="submit" class="btn btn--primary">Add Transaction</button>
        </form>
      </article>

      <!-- Settings Panel -->
      <article class="card" id="settings-section">
        <h2>Settings</h2>

        <!-- Budget -->
        <div class="field-group">
          <label for="budget-input">Budget</label>
          <div class="input-row">
            <input
              type="number"
              id="budget-input"
              placeholder="0.00"
              min="0"
              step="0.01"
            />
            <button type="button" id="set-budget-btn" class="btn btn--secondary">Set Budget</button>
          </div>
        </div>

        <!-- Spending Limit -->
        <div class="field-group">
          <label for="limit-input">Spending Limit</label>
          <div class="input-row">
            <input
              type="number"
              id="limit-input"
              placeholder="Optional"
              min="0.01"
              step="0.01"
            />
            <button type="button" id="set-limit-btn" class="btn btn--secondary">Set Limit</button>
          </div>
        </div>

        <!-- Custom Category -->
        <div class="field-group">
          <label for="category-input">Add Category</label>
          <div class="input-row">
            <input
              type="text"
              id="category-input"
              placeholder="e.g. Health"
              maxlength="50"
              autocomplete="off"
            />
            <button type="button" id="add-category-btn" class="btn btn--secondary">Add</button>
          </div>
          <span class="field-error" id="category-input-error" role="alert"></span>
        </div>

      </article>

    </section>

    <!-- Right column (balance / chart / list) -->
    <section class="panel panel--right">

      <!-- Spending Limit Warning Banner -->
      <div id="limit-warning" class="warning-banner" hidden>
        ⚠️ Total expenditure has exceeded your spending limit!
      </div>

      <!-- Chart Container -->
      <article class="card" id="chart-section">
        <h2>Spending by Category</h2>
        <div class="chart-wrapper">
          <canvas id="spending-chart" aria-label="Spending pie chart" role="img"></canvas>
          <p id="chart-placeholder" class="empty-state">Add transactions to see the chart.</p>
        </div>
      </article>

      <!-- Transaction List -->
      <article class="card" id="list-section">
        <div class="list-header">
          <h2>Transactions</h2>
          <!-- Sort control -->
          <div class="field-group field-group--inline">
            <label for="sort-select" class="sr-only">Sort by</label>
            <select id="sort-select">
              <option value="latest">Latest</option>
              <option value="oldest">Oldest</option>
              <option value="amount-desc">Amount ↓</option>
              <option value="amount-asc">Amount ↑</option>
              <option value="category-az">Category A–Z</option>
            </select>
          </div>
        </div>

        <ul id="transaction-list" class="transaction-list" aria-live="polite">
          <!-- populated by renderTransactionList() -->
        </ul>
      </article>

    </section>

  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="site-footer">
    <p>&copy; 2025 Expense &amp; Budget Visualizer. All data stored locally in your browser.</p>
  </footer>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- App logic -->
  <script src="js/app.js"></script>

</body>
</html>
